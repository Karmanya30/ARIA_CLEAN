<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/brand/aria-mark-64.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA Live Avatar</title>
<style>
  :root { --bg:#0f1720; --panel:rgba(15,23,32,.72); --ink:#f3f5f8; --muted:#a9b3c1; --accent:#4ade80; --warn:#fbbf24; --err:#f87171; }
  html, body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 30%, #243447 0%, var(--bg) 70%); color:var(--ink);
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #avatar { position:absolute; inset:0; }
  #office { display:none; }
  #avatar canvas { filter:contrast(1.03) saturate(1.04); }  /* a light studio grade */
  /* a soft vignette and a darker foot: the face is the focus and the captions are always legible */
  #avatar::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%, transparent 52%, rgba(6,10,16,.34) 100%), linear-gradient(transparent 62%, rgba(6,10,16,.42)); }
  .chip { position:absolute; top:12px; padding:5px 10px; border-radius:99px; background:var(--panel); font-size:12px; backdrop-filter:blur(6px); }
  #state { left:12px; } #state::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); vertical-align:1px; }
  #state[data-s="listening"]::before { background:var(--accent); animation:pulse 1.2s infinite; }
  #state[data-s="thinking"]::before { background:var(--warn); } #state[data-s="speaking"]::before { background:#60a5fa; }
  #state[data-s="error"]::before { background:var(--err); }
  #latency { right:12px; color:var(--muted); }
  @keyframes pulse { 50% { opacity:.3; } }
  #caption { position:absolute; left:50%; bottom:86px; transform:translateX(-50%); width:min(92%, 620px); text-align:center;
    font-size:15px; text-shadow:0 1px 3px #000; min-height:22px; }
  #caption .you { color:var(--muted); display:block; font-size:13px; }
  /* phones: a short frame, so keep the caption to a few small lines low down (the full reply is in the transcript) */
  @media (max-width:600px) { #caption { bottom:74px; font-size:13px; max-height:5.2em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); } }
  #bar { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:min(94%, 640px); display:flex; gap:8px;
    padding:8px; border-radius:99px; background:var(--panel); backdrop-filter:blur(8px); }
  #bar input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; padding:0 10px; }
  button { border:0; border-radius:99px; padding:9px 14px; font:600 13px system-ui, sans-serif; cursor:pointer; background:#2b3a4d; color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  #mic.on { background:var(--accent); color:#0b1b10; }
  #start { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(8,12,18,.55); backdrop-filter:blur(3px); text-align:center; padding:20px; }
  #start button { background:var(--accent); color:#0b1b10; padding:13px 26px; font-size:15px; }
  #start p { margin:0; max-width:420px; color:var(--muted); }
  #note { color:var(--warn) !important; }
  html.meeting, .meeting body { background:radial-gradient(ellipse at 50% 35%,#25362e,#101a15 75%); }
  .meeting #bar,.meeting #state,.meeting #latency { display:none; }
  .meeting #avatar { inset:0; }
  .meeting #office { display:block; position:absolute; inset:0; overflow:hidden; background:#14231f; }
  .meeting #office::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,#06110a24,transparent 35%,transparent 65%,#06110a24),linear-gradient(0deg,#06110a80,transparent 50%); }
  .meeting #office > div { display:none; }
  .office-daylight { position:absolute; inset:0; background:linear-gradient(110deg,#e9f8ee28,transparent 48%); animation:office-daylight 16s ease-in-out infinite alternate; }
  .office-reflection { position:absolute; top:0; bottom:0; left:60%; width:22%; background:linear-gradient(100deg,transparent,#e7f6ee12,transparent); transform:skewX(-8deg); animation:office-reflection 22s ease-in-out infinite alternate; }
  .office-monitor { position:absolute; right:0; top:43%; width:14%; height:20%; background:radial-gradient(ellipse,#acd6e213,transparent 70%); animation:office-monitor 9s ease-in-out infinite alternate; }
  @keyframes office-daylight { from { opacity:.35; } to { opacity:.9; } }
  @keyframes office-reflection { from { transform:translateX(-5%) skewX(-8deg); opacity:.3; } to { transform:translateX(35%) skewX(-8deg); opacity:.8; } }
  @keyframes office-monitor { from { opacity:.2; } to { opacity:.85; } }
  #userTranscript { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); max-width:80%; border-radius:10px; padding:7px 12px; background:#08150cdd; font-size:12px; color:#d5e7df; }
  #userTranscript:empty { display:none; }
  #start .start-brand { width:74px; height:74px; object-fit:contain; }
  .meeting #caption { bottom:60px; background:#09120ed9; border-radius:12px; padding:14px 20px; width:max-content; max-width:min(80%,680px); font-size:16px; line-height:1.6; min-height:0; max-height:30%; overflow:auto; box-sizing:border-box; }
  .meeting #caption:empty { display:none; }
  .meeting #start { background:#0a140f66; backdrop-filter:blur(5px); }
  .meeting #start h1 { font-size:32px; font-weight:500; letter-spacing:-1px; margin:0; }
  .meeting #start button { background:#a2dfc6; color:#12251c; border-radius:12px; }
  button:focus-visible { outline:2px solid #a2dfc6; outline-offset:4px; }
  @media(max-width:600px) { .meeting #caption { font-size:13px; max-width:90%; bottom:50px; mask-image:none; -webkit-mask-image:none; } }
  @media(prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
<!-- Same pinned TalkingHead build as avatar.html (see the note there on why a commit, not a tag). MIT licensed, loaded from jsdelivr. -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1a7ca9c8a9/modules/talkinghead.mjs"
} }
</script>
</head>
<body>
<div id="office" aria-hidden="true"><div class="office-daylight"></div><div class="office-reflection"></div><div class="office-monitor"></div></div>
<div id="avatar"></div>
<div id="state" class="chip" data-s="idle">Loading avatar…</div>
<div id="latency" class="chip" title="Time from the end of your question to ARIA's first word">—</div>
<div id="caption"></div>
<div id="userTranscript" role="status" aria-label="Your speech transcript"></div>
<div id="bar">
  <button id="mic" type="button" disabled title="Talk to ARIA">🎤 Mic</button>
  <input id="text" placeholder="…or type and press Enter" autocomplete="off" disabled>
  <button id="stop" type="button" disabled title="Interrupt ARIA">Stop</button>
</div>
<div id="start">
  <img class="start-brand" src="/brand/aria-mark-128.png" alt="ARIA">
  <h1>Your space for clarity.</h1>
  <button id="startBtn" type="button" disabled>Loading…</button>
  <p>Talk through your finances with ARIA. Start your meeting, then turn on the microphone or open chat.</p>
  <p id="note"></p>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const stateEl = $("state"), latencyEl = $("latency"), captionEl = $("caption"), micBtn = $("mic"), textEl = $("text"), stopBtn = $("stop");
const params = new URLSearchParams(location.search);
const meeting = params.get("meeting") === "1";
document.documentElement.classList.toggle("meeting", meeting);
const SESSION = params.get("session_id") || "live";
const OWNER = params.get("owner_id") || localStorage.getItem("aria_owner_id");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_RECORD = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
const HEADAUDIO = "https://cdn.jsdelivr.net/gh/met4citizen/HeadAudio@v0.1.0-alpha/dist/";
const VISION = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

let speaker = null, ws = null, rec = null;
let micOn = false, speaking = false, awaitingEnd = false, turn = 0, tAsked = 0, firstAudioSeen = false, answer = "", quietSince = 0;
let ended = false, started = false, connected = false, processing = false, reconnectTimer = 0;
let captionClips = [], currentCaption = "";
let interimTranscript = "", interimTimer = 0, lastServerEvent = 0;

function publishState() { tellParent({ type: "state", state: { status: stateEl.dataset.s, label: stateEl.textContent, connected, started, micOn, listening, speaking, processing, supported: !!SR || CAN_RECORD } }); }
function setState(s, label) { stateEl.dataset.s = s; stateEl.textContent = label; publishState(); }
function caption(you, ariaText) {
  $("userTranscript").textContent = you ? "You: " + you : "";
  captionEl.innerHTML = "";
  if (ariaText) {  // subtitles show the latest words only, cut at a word boundary; the full reply is in the transcript
    captionEl.appendChild(document.createTextNode(ariaText));
  }
}
function tellParent(msg) { try { parent.postMessage({ source: "aria-live", ...msg }, location.origin); } catch (e) {} }

// Captions use the same AudioContext clock as the scheduled sentence, including GPU buffering.
function scheduleCaption(text, at, duration, forTurn = turn) {
  if (ended || forTurn !== turn) return;
  captionClips.push({ text, at, end: at + duration, turn: forTurn });
}
function updateCaption() {
  if (ended || !speaker) return;
  const now = speaker.ctx.currentTime;
  const clip = captionClips.find(c => c.turn === turn && c.at <= now && c.end > now);
  if (clip && currentCaption !== clip.text) {
    currentCaption = clip.text; caption(null, clip.text); setState("speaking", "ARIA is speaking");
  }
  captionClips = captionClips.filter(c => c.turn === turn && c.end > now);
}

// ── speakers: one interface, two looks ────────────────────────────────────
// { ctx, play(buffer, text), stop(), busy() }. Both queue clips back to back in arrival order.

async function threeDSpeaker() {
  const { TalkingHead } = await import("talkinghead");
  const head = new TalkingHead($("avatar"), { cameraView: "upper", lipsyncModules: ["en"], cameraRotateEnable: false });
  await head.showAvatar({ url: "/avatar/model.glb", body: "F", avatarMood: "happy", lipsyncLang: "en" }, (ev) => {
    if (ev.lengthComputable) setState("idle", "Loading avatar " + Math.round((ev.loaded / ev.total) * 100) + "%");
  });

  try {  // mouth driven by the actual voice
    const { HeadAudio } = await import(HEADAUDIO + "headaudio.min.mjs");
    await head.audioCtx.audioWorklet.addModule(HEADAUDIO + "headworklet.min.mjs");
    const ha = new HeadAudio(head.audioCtx, {});
    await ha.loadModel(HEADAUDIO + "model-en-mixed.bin");
    head.audioSpeechGainNode.connect(ha);
    ha.onvalue = (key, value) => { if (head.mtAvatar && head.mtAvatar[key]) Object.assign(head.mtAvatar[key], { newvalue: value, needsUpdate: true }); };
    head.opt.update = ha.update.bind(ha);
    visemes = true;
  } catch (err) { console.warn("HeadAudio unavailable; using text-timed lip-sync", err); }

  document.addEventListener("visibilitychange", visibility);
  return {
    kind: "3d", ctx: head.audioCtx,
    play(buffer, text) {
      const clip = { audio: buffer };
      const forTurn = turn;
      const words = text.split(/\s+/).filter(Boolean);
      if (!visemes && words.length) {
        const total = buffer.duration * 1000, chars = words.reduce((n, w) => n + w.length + 1, 0);
        let t = 0; clip.words = words; clip.wtimes = []; clip.wdurations = [];
        for (const w of words) { const d = total * (w.length + 1) / chars; clip.wtimes.push(t); clip.wdurations.push(d); t += d; }
      }
      clip.words ||= [];
      clip.markers = [() => scheduleCaption(text, head.audioCtx.currentTime, buffer.duration, forTurn)];
      clip.mtimes = [0];
      head.lookAtCamera(500);
      head.speakAudio(clip);
    },
    stop() { head.stopSpeaking(); },
    dispose() { document.removeEventListener("visibilitychange", visibility); head.stopSpeaking(); head.stop(); head.audioCtx.close(); },
    busy() { return !!head.isSpeaking; },
  };
}

// Talking photo: face landmarks are found once (MediaPipe, in the browser), then every frame the jaw and lower lip are
// pushed down by the loudness of ARIA's voice with a mesh warp, a mouth opening is painted between the lips, the eyes
// blink and the head breathes. No server, no GPU model.
// opts.frame: a function returning the current frame to show (MuseTalk's) instead of the still photo; opts.jaw=false
// leaves the mouth to that frame and keeps only the blinks, breathing, sway and nods.
async function photoSpeaker(opts = {}) {

  const glasses = await new Promise((ok) => { const i = new Image(); i.onload = () => ok(i.width === img.width && i.height === img.height ? i : null); i.onerror = () => ok(null); i.src = "/avatar/glasses.png?" + Date.now(); });

  const { FaceLandmarker, FilesetResolver } = await import(VISION + "/vision_bundle.mjs");
  const fileset = await FilesetResolver.forVisionTasks(VISION + "/wasm");
  const detector = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
    runningMode: "IMAGE", numFaces: 1,

  // central upper region first, then map landmarks back to the full scene.
  const region = { x: img.width * .25, y: 0, w: img.width * .5, h: img.height * .7 };
  const big = document.createElement("canvas"); big.width = Math.round(region.w); big.height = Math.round(region.h);
  const bctx = big.getContext("2d"); bctx.imageSmoothingQuality = "high";
  bctx.drawImage(img, region.x, region.y, region.w, region.h, 0, 0, big.width, big.height);

  const found = local ? local.map(p => ({ ...p, x: (region.x + p.x * region.w) / img.width, y: (region.y + p.y * region.h) / img.height })) : detector.detect(img).faceLandmarks[0];

  const L = { upperIn: P(13), lowerIn: P(14), lowerOut: P(17), chin: P(152), left: P(61), right: P(291), nose: P(1),

  const face = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
  const faceW = face.x1 - face.x0, faceH = face.y1 - face.y0, mouthW = Math.hypot(L.right.x - L.left.x, L.right.y - L.left.y);
  const mouth = { x: (L.upperIn.x + L.lowerIn.x) / 2, y: (L.upperIn.y + L.lowerIn.y) / 2 };
  const lipLine = mouth.y;
  const mid3 = (a, b, c) => ({ x: (P(a).x + P(b).x + P(c).x) / 3, y: (P(a).y + P(b).y + P(c).y) / 3 });
  const browC = [mid3(63, 105, 66), mid3(296, 334, 293)], browInner = [P(107), P(336)], corners = [L.left, L.right];  // image-left first
  // Keep the complete seated composition. On narrow screens only the office sides
  // crop away; the face and resting hands remain within the protected center.
  const crop = { x: 0, y: 0, w: img.width, h: img.height };

  const canvas = document.createElement("canvas"); canvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
  canvas.style.opacity = "0"; canvas.style.transition = "opacity 500ms ease";
  $("avatar").appendChild(canvas);
  const g = canvas.getContext("2d");
  const src = document.createElement("canvas"); src.width = img.width; src.height = img.height;  // this frame's picture, photo-sized
  const sctx = src.getContext("2d");
  // Cache clear office-only extensions at the viewport size; no person is copied into
  // the sides. Mirroring preserves the boundary colors and desk/window heights.
  const surround = document.createElement("canvas"), surroundCtx = surround.getContext("2d");
  function officeSurround(scale) {
    if (surround.width === canvas.width && surround.height === canvas.height) return;
    surround.width = canvas.width; surround.height = canvas.height;
    const left = (canvas.width - img.width * scale) / 2;
    const top = (canvas.height - img.height * scale) / 2;

    surroundCtx.drawImage(img, 0, 0, edge, img.height, 0, -12, left + overlap + 24, img.height * scale + 24);

  const TAU = { browL: 0.10, browR: 0.10, furrow: 0.20, smile: 0.32, squint: 0.22, tilt: 0.6, nod: 0.16, pan: 0.40 };
  const baseline = { speaking: { smile: 0.22 }, listening: { tilt: 0.004, browL: 0.12, browR: 0.12 }, thinking: { tilt: -0.007, browL: 0.5, browR: 0.12, pan: 0.5 } };
  let pose = { rot: 0, bob: 0, sway: 0, s: 1, half: 0 }, lastNod = 0, events = [], nextIdle = performance.now() + 2500, lastOnset = 0, avgLevel = 0, lastState = "idle", prevNow = performance.now();
  const rnd = (a, b) => a + Math.random() * (b - a), pick = (...fns) => fns[Math.floor(Math.random() * fns.length)];

    brows: (n) => fire(n, rnd(350, 600), { browL: rnd(0.5, 0.9), browR: rnd(0.5, 0.9) }),
    oneBrow: (n) => fire(n, rnd(500, 800), Math.random() < 0.5 ? { browL: 0.8 } : { browR: 0.8 }),
    smile: (n) => fire(n, rnd(1400, 2400), { smile: rnd(0.5, 0.8), squint: 0.35 }),
    tilt: (n) => fire(n, rnd(1800, 3000), { tilt: (Math.random() < 0.5 ? -1 : 1) * rnd(0.006, 0.010) }),
    nod: (n) => { if (n - lastNod > 2500) { lastNod = n; fire(n, 300, { nod: rnd(0.25, 0.45) }); } },  // rare and small: frequent nods read as bobbing
    furrow: (n) => fire(n, rnd(500, 900), { furrow: rnd(0.4, 0.7) }),
    squint: (n) => fire(n, 900, { squint: 0.5 }),

    events = events.filter((e) => e.until > now);
    const st = stateEl.dataset.s;
    if (st !== lastState) {

      if (st === "speaking") fire(now, 1200, { smile: 0.55, browL: 0.35, browR: 0.35 });  // and a bright start
      lastState = st;
    }
    avgLevel += (level - avgLevel) * 0.03;  // emphasis: a word clearly louder than the recent average lifts the brows / nods
    if (st === "speaking" && level > 0.03 && level > avgLevel * 1.8 && now - lastOnset > 700) { lastOnset = now; pick(moves.brows, moves.brows, moves.nod)(now); }
    if (now > nextIdle) { nextIdle = now + rnd(2600, 6200); (st === "speaking" ? pick(moves.tilt, moves.squint, moves.smile) : pick(moves.brows, moves.oneBrow, moves.smile, moves.tilt, moves.tilt, moves.nod))(now); }
    const base = baseline[st] || {};

      expr[k] += (tgt - expr[k]) * (1 - Math.exp(-dt / TAU[k]));

  }

  // mesh over the lower face and the eyes; everything else is drawn once, unwarped
  const N = 14, gx0 = face.x0 - faceW * 0.15, gx1 = face.x1 + faceW * 0.15, gy0 = face.y0 + faceH * 0.15, gy1 = Math.min(img.height, face.y1 + faceH * 0.25);
  const grid = []; for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) grid.push({ x: gx0 + (gx1 - gx0) * i / N, y: gy0 + (gy1 - gy0) * j / N });
  const smooth = (t) => Math.max(0, Math.min(1, t)) ** 2 * (3 - 2 * Math.max(0, Math.min(1, t)));
  function displaced(p, A, blink) {
    let dx = 0, dy = 0;
    const wx = Math.exp(-(((p.x - mouth.x) / (faceW * 0.42)) ** 2));
    // jaw and lower lip: 0 above the lip line, full from the lower lip to the chin, fading out below the chin
    // the photo's lips are usually closed, so the split is a narrow band at the lip line, not upper-to-lower lip
    const below = smooth((p.y - (lipLine - mouthW * 0.03)) / (mouthW * 0.09));
    const fade = 1 - smooth((p.y - L.chin.y) / (faceH * 0.22));
    dy += A * wx * below * fade;
    // upper lip lifts a little

// avatar's), which renders the whole phrase as a short silent video (/lipsync_video, 25 frames a second, the source's own rate, whole scene).
// The page plays it in a plain <video> on top of the held frame, started just ahead of the voice and kept on the audio clock, so there is
// no per-frame drawing to stutter. Every phrase is requested the moment its voice arrives (the server renders them in order), and the
// answer starts only when the renders are far enough ahead of the voice that the next phrase will be ready at the full stop: the pause
// between sentences is then only the pause in the voice. While more phrases are still being rendered she keeps her speaking face (the last

// with none configured it is the local server on :8010, as before. A cold GPU takes about a minute to start, so a GPU address is given time.
// An address that answers with an error or cannot be reached (out of credit, down) hands over to the next address; one that is only slow does
// not (that would wake the backup GPU as well).
async function connectLipsync() {
  let list = [{ url: params.get("musetalk") || `http://${location.hostname}:8010`, token: "" }];

  started = true;
  $("start").remove();
  textEl.disabled = false; textEl.focus();
  // the mic stays closed until asked: opening it at once switches Bluetooth headsets to their quiet call mode
  if (SR || CAN_RECORD) { micBtn.disabled = false; setState("muted", "Microphone muted. Press the microphone to speak, or type."); } else setState("muted", "Voice input needs microphone recording support. Open chat to type.");
};

async function loadSpeaker() {
  // Unchanged order: MuseTalk when its GPU server is running (E:\musetalk), else the seated photo, else 3D.
  // ?avatar=video is the separate "New ARIA Avatar"; ?avatar=photo or ?avatar=3d forces the others.
  if (!params.get("avatar")) {
    try { return await museTalkSpeaker(); } catch (err) { console.info("MuseTalk not available:", err.message); }
  }
  if (params.get("avatar") === "video") {  // "New ARIA Avatar": only when chosen; the existing avatars below are unchanged
    try { return await lipSyncVideoSpeaker(); } catch (err) { console.info("New ARIA Avatar lip-sync not available:", err.message); }
    try {
      const v = await videoSpeaker();
      $("note").textContent = "The New ARIA Avatar's lip-sync GPU is not available right now, so she speaks without moving her lips. Try again in a few minutes.";
      return v;
    } catch (err) { console.info("New ARIA Avatar not available:", err.message); }
  }
  const photo = params.get("avatar") !== "3d" && (await fetch("/avatar/office-wide-glasses.webp", { cache: "no-store" }).then((r) => r.ok).catch(() => false));
  if (photo) {
    try { return await photoSpeaker(); } catch (err) { console.warn("Talking photo unavailable, using the 3D avatar", err); $("note").textContent = "Couldn't animate the photo (" + err.message + "); showing the 3D avatar."; }
  }
  return threeDSpeaker();
}

loadSpeaker().then((s) => {
  if (ended) { s.stop(); s.ctx.close(); return; }
  speaker = s;
  connect();
  if (!SR && !CAN_RECORD) $("note").textContent = "Voice input needs microphone recording support. You can still type.";
}).catch((err) => { if (ended) return; setState("error", "Avatar failed to load. Leave and try again."); $("note").textContent = "The avatar could not load. It needs internet access to fetch its animation files. Leave the meeting and switch to Chat to keep going."; console.error(err); });

function endSession() {
  if (ended) return;
  ended = true; micOn = false; started = false; connected = false; turn += 1;
  clearTimeout(reconnectTimer); clearInterval(watchdog); stopRec();
  captionClips = []; speaker?.stop();
  if (speaker?.dispose) speaker.dispose(); else speaker?.ctx.close();
  if (ws) { ws.onclose = null; ws.close(); }
  tellParent({ type: "ended" });
}
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin || ev.source !== parent || ev.data?.source !== "aria-meeting" || ended) return;
  const m = ev.data;
  if (m.type === "ask" && typeof m.text === "string") ask(m.text, true);
  if (m.type === "mic") micBtn.click();
  if (m.type === "speak") speakControl();
  if (m.type === "captions") captionEl.hidden = !m.enabled;
  if (m.type === "end") endSession();
});
window.addEventListener("pagehide", endSession);
window.addEventListener("keydown", ev => { if (ev.key === "Escape") tellParent({ type: "escape" }); });

window.__ariaLive = { speaker: () => speaker, ask, interrupt, state: () => stateEl.dataset.s, kind: () => speaker && speaker.kind, blink: () => speaker && speaker.blinkNow && speaker.blinkNow(), express: (n) => speaker && speaker.express && speaker.express(n), pose: () => speaker && speaker.pose && speaker.pose() };  // used by the automated checks
</script>
</body>
</html>
