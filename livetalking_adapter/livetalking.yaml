# ARIA's LiveTalking settings (serve.py passes this via --config; CLI/LT_* env knobs override).
model: wav2lip
avatar_id: wav2lip256_avatar1
batch_size: 8
tts: piper                # ARIA plugin livetalking_adapter/piper_tts.py (needs upstream.patch, applied by serve.py)
REF_FILE: ''
REF_TEXT: ''
TTS_SERVER: ''
transport: webrtc
stun: ''                  # no external ICE servers: localhost only
max_session: 2
listenport: 8020          # upstream default 8010 collides with ARIA's avatar_engine
fps: 25
