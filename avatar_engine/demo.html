<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARIA avatar engine demo</title>
<style>
body{font:14px system-ui;margin:0;padding:16px;background:#0f1216;color:#e6e8eb;display:flex;gap:16px;flex-wrap:wrap}
canvas{background:#222;border-radius:12px;max-width:100%}
.p{max-width:420px;display:flex;flex-direction:column;gap:8px}
textarea,select,input,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #3a4250;background:#1b2028;color:inherit}
button{cursor:pointer;background:#2b5cff;border:0}button.s{background:#3a4250}
#log{font:12px ui-monospace,monospace;color:#9aa4b2;white-space:pre-wrap;max-height:220px;overflow:auto}
</style></head><body>
<canvas id="c" width="512" height="512"></canvas>
<div class="p">
 <div>state: <b id="st">-</b> &middot; <span id="cap"></span></div>
 <textarea id="t" rows="4">Hello, I am ARIA, your financial companion.</textarea>
 <select id="emo"><option>neutral</option><option>warm</option><option>serious</option><option>concerned</option><option>upbeat</option></select>
 <select id="bg"><option value="original">background: original</option><option value="blur">blur</option><option value="#0b1d3a">solid navy</option></select>
 <div><button id="sp">Speak</button> <button id="in" class="s">Interrupt</button> <button id="li" class="s">Listening</button></div>
 <div><input type="file" id="f" accept="image/*,video/*"> <button id="up" class="s">Create replica</button> <select id="rep"></select></div>
 <div id="log"></div>
</div>
<script>
const $=id=>document.getElementById(id), log=s=>{$('log').textContent=(s+'\n'+$('log').textContent).slice(0,3000)};
const ctx2d=$('c').getContext('2d'); let ws,ac,off=null,frames=[],BUF=180;
const base=location.origin;
async function replicas(){const r=await (await fetch(base+'/replicas')).json();$('rep').innerHTML=r.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}
function connect(){
  ac=ac||new AudioContext(); off=null; frames=[];
  ws=new WebSocket(`ws://${location.host}/stream?replica_id=${$('rep').value||'default'}&bg=${encodeURIComponent($('bg').value)}&takeover=1`);
  ws.binaryType='arraybuffer';
  ws.onmessage=async e=>{
    if(typeof e.data==='string'){const m=JSON.parse(e.data);
      if(m.type==='state'){$('st').textContent=m.value+(m.reason?' ('+m.reason+')':'');if(m.value==='idle'||m.value==='unavailable')flush()}
      else if(m.type==='caption')$('cap').textContent=m.text; else log(e.data);return}
    const dv=new DataView(e.data),type=dv.getUint8(0),ts=dv.getUint32(5,true),now=performance.now();
    if(off===null)off=now-ts;                       // stream clock -> local clock
    const at=off+ts+BUF;
    if(type===1){const bmp=await createImageBitmap(new Blob([e.data.slice(9)]));frames.push({at,bmp})}
    else{const sr=dv.getUint32(9,true),pcm=new Int16Array(e.data.slice(13)),b=ac.createBuffer(1,pcm.length,sr),ch=b.getChannelData(0);
      for(let i=0;i<pcm.length;i++)ch[i]=pcm[i]/32768;
      const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);srcs.push(s);
      s.start(Math.max(ac.currentTime,ac.currentTime+(at-performance.now())/1000));s.onended=()=>srcs.splice(srcs.indexOf(s),1)}
  };
  ws.onclose=()=>{$('st').textContent='disconnected'};
}
const srcs=[];function flush(){srcs.splice(0).forEach(s=>{try{s.stop()}catch(e){}})}
(function draw(){const n=performance.now();let f=null;while(frames.length&&frames[0].at<=n)f=frames.shift();
  if(f){if($('c').width!==f.bmp.width){$('c').width=f.bmp.width;$('c').height=f.bmp.height}ctx2d.clearRect(0,0,1e4,1e4);ctx2d.drawImage(f.bmp,0,0)}requestAnimationFrame(draw)})();
$('sp').onclick=()=>{ac.resume();ws.send(JSON.stringify({type:'speak',text:$('t').value,emotion:$('emo').value}))};
$('in').onclick=()=>{ws.send(JSON.stringify({type:'interrupt'}));flush()};
$('li').onclick=()=>ws.send(JSON.stringify({type:'listening',value:true}));
$('emo').onchange=()=>ws.send(JSON.stringify({type:'configure',emotion:$('emo').value}));
$('bg').onchange=()=>ws.send(JSON.stringify({type:'configure',background:$('bg').value}));
$('rep').onchange=connect;
$('up').onclick=async()=>{const f=$('f').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);log('building replica...');
  const r=await fetch(base+'/replicas',{method:'POST',body:fd});log(await r.text());await replicas()};
replicas().then(connect);
</script></body></html>
