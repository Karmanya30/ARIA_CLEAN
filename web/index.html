<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser this page is intentionally light-themed, so
         browser-level "force dark mode" (Edge/Chrome's auto-darkening of
         web content) doesn't heuristically invert it into a muddy,
         desaturated dark render on top of our own light CSS. -->
    <meta name="color-scheme" content="light" />
    <title>ARIA</title>
    <!-- Apply the saved UI theme before first paint so there is no flash of the
         default one. Same key as src/theme.ts; unknown values fall back to Classic. -->
    <script>
      try {
        var q = new URLSearchParams(location.search).get('theme') // ?theme=<id> for screenshots / demo links
        if (q) localStorage.setItem('aria_theme', q)
        document.documentElement.dataset.theme = localStorage.getItem('aria_theme') || 'classic'
        // Colour mode (only styled by the Vitara Markets theme): light | night | auto. Same key as src/theme.ts.
        var m = new URLSearchParams(location.search).get('mode') // ?mode=night for screenshots / demo links
        if (m) localStorage.setItem('aria_mode', m)
        m = localStorage.getItem('aria_mode')
        if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light'
        document.documentElement.dataset.mode = m === 'night' ? 'night' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
