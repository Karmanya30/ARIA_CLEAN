<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=aria-brand-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page has its own light and night palettes. Declaring both stops browser-level
         "force dark mode" (Edge/Chrome auto-darkening) from inverting it into a muddy render. -->
    <meta name="color-scheme" content="light dark" />
    <title>ARIA</title>
    <!-- Apply the saved UI theme before first paint so there is no flash of the
         default one. Same key as src/theme.ts; unknown values fall back to Classic. -->
    <script>
      try {
        var q = new URLSearchParams(location.search).get('theme') // ?theme=<id> for screenshots / demo links
        if (q) localStorage.setItem('aria_theme', q)
        document.documentElement.dataset.theme = 'vitara-markets'
        // Colour mode (only styled by the Vitara Markets theme): light | night | auto. Same key as src/theme.ts.
        var m = new URLSearchParams(location.search).get('mode') // ?mode=night for screenshots / demo links
        if (m) localStorage.setItem('aria_mode', m)
        m = localStorage.getItem('aria_mode') || 'auto' // no choice yet: follow the device
        if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'light'
        document.documentElement.dataset.mode = m === 'night' ? 'night' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
